    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS

    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where

    // local text and treats a miss as authoritative — never relaying to

      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.

      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.

    }

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.

      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

abular-nums\">{{ s.display }}<\u002Fspan><\u002Fdiv>\n            <input type=\"range\" min=\"{{ s.min }}\" max=\"{{ s.max }}\" step=\"{{ s.step }}\" value=\"{{ s.value }}\" sc-camel-on-change=\"{{ s.set }}\" style=\"width:100%;accent-color:#0A84FF;cursor:pointer;margin:0\">\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"border-top:1px solid rgba(84,84,88,0.4);padding-top:10px\">\n          <div sc-camel-on-click=\"{{ suggest }}\" style=\"font-size:13px;font-weight:600;color:#0A84FF;cursor:pointer;user-select:none\" style-hover=\"color:#4DA3FF\">Πρόταση από προφίλ &amp; συνθήκες<\u002Fdiv>\n          <div style=\"font-size:11px;color:rgba(235,235,245,0.50);line-height:1.5;margin-top:4px\">Από το προφίλ σου + 30°C — υγρά &amp; νάτριο κλιμακωμένα για εφίδρωση και ζέστη· υδατάνθρακες με όριο τα 80 g/hr του στομαχιού σου.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#212630;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px\">\n        <div style=\"font-size:12px;color:rgba(235,235,245,0.60)\">Μέθοδος προγράμματος<\u002Fdiv>\n        <div style=\"display:flex;background:rgba(255,255,255,0.06);border-radius:999px;padding:3px;font-size:12px;font-weight:600\">\n          <div sc-camel-on-click=\"{{ setCp }}\" style=\"flex:1;text-align:center;padding:6px 0;border-radius:999px;cursor:pointer;user-select:none;background:{{ cpSel }};color:{{ cpCol }}\">Βάσει CP<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ setTime }}\" style=\"flex:1;text-align:center;padding:6px 0;border-radius:999px;cursor:pointer;user-select:none;background:{{ timeSel }};color:{{ timeCol }}\">Βάσει χρόνου<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:10px;color:rgba(235,235,245,0.30);text-align:center\">Σύρε τα sliders — είναι ζωντανά<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:14px\">\n      <div style=\"font-size:13px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#0A84FF\">ΤΡΟΦΟΔΟΣΙΑ<\u002Fdiv>\n      <h2 style=\"margin:0;font-size:36px;font-weight:800;letter-spacing:-0.01em;line-height:1.12\">Ένα πλάνο για κάθε σταθμό<\u002Fh2>\n      <p style=\"margin:0;font-size:16px;line-height:1.65;color:rgba(235,235,245,0.60);text-wrap:pretty\">Όρισε ωριαίους στόχους για νερό, υδατάνθρακα και νάτριο — ή άφησε το Oxygon να τους προτείνει από τον ρυθμό εφίδρωσής σου, το όριο του στομαχιού σου και την πρόγνωση. Μοιράζει τις δόσεις στους σταθμούς σου· ό,τι διορθώσεις με το χέρι δεν το ξαναγράφει ποτέ ο επανυπολογισμός.<\u002Fp>\n      <div style=\"display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:rgba(235,235,245,0.60)\">\n        <span style=\"border:1px solid rgba(84,84,88,0.6);border-radius:999px;padding:5px 12px\">Σκανάρισμα barcode<\u002Fspan>\n        <span style=\"border:1px solid rgba(84,84,88,0.6);border-radius:999px;padding:5px 12px\">Βάση πραγματικών προϊόντων<\u002Fspan>\n        <span style=\"border:1px solid rgba(84,84,88,0.6);border-radius:999px;padding:5px 12px\">Διαδρομές GPX<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center\">\n    <div style=\"display:flex;flex-direction:column;gap:14px\">\n      <div style=\"font-size:13px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#0A84FF\">ΠΡΟΠΟΝΗΤΗΣ<\u002Fdiv>\n      <h2 style=\"margin:0;font-size:36px;font-weight:800;letter-spacing:-0.01em;line-height:1.12\">Ένα μπλοκ προπόνησης που προσαρμόζεται<\u002Fh2>\n      <p style=\"margin:0;font-size:16px;line-height:1.65;color:rgba(235,235,245,0.60);text-wrap:pretty\">Μια καθοδηγούμενη συνέντευξη χτίζει το πλάνο σου — νορβηγικό threshold ή βασισμένο σε ρυθμούς. Φυσική κατάσταση, κόπωση, φόρμα και αντοχή σε βάθος από Apple&nbsp;Health και Strava. Ρώτα τον προπονητή ό,τι θες· όπου προτείνει αλλαγή, την επιβεβαιώνεις εσύ με ένα κουμπί — ποτέ σιωπηλά.<\u002Fp>\n      <div style=\"display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:rgba(235,235,245,0.60)\">\n        <span style=\"border:1px solid rgba(84,84,88,0.6);border-radius:999px;padding:5px 12px\">Apple Health<\u002Fspan>\n        <span style=\"border:1px solid rgba(84,84,88,0.6);border-radius:999px;padding:5px 12px\">Strava<\u002Fspan>\n        <span style=\"border:1px solid rgba(84,84,88,0.6);border-radius:999px;padding:5px 12px\">AI συνομιλία<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <img src=\"8d216b50-da64-4286-8798-cf65eb5a57dc\" alt=\"Ημερολόγιο προπονητή\" style=\"width:300px;border-radius:32px;border:1px solid rgba(84,84,88,0.6);justify-self:center\">\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center\">\n    <img src=\"608e1a1b-fbac-42b2-92f5-f6e15b92ff97\" alt=\"Live δραστηριότητα\" style=\"width:300px;border-radius:32px;border:1px solid rgba(84,84,88,0.6);justify-self:center\">\n    <div style=\"display:flex;flex-direction:column;gap:14px\">\n      <div style=\"font-size:13px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#0A84FF\">Live<\u002Fdiv>\n      <h2 style=\"margin:0;font-size:36px;font-weight:800;letter-spacing:-0.01em;line-height:1.12\">Φτιαγμένο να διαβάζεται εν κινήσει<\u002Fh2>\n      <p style=\"margin:0;font-size:16px;line-height:1.65;color:rgba(235,235,245,0.60);text-wrap:pretty\">Παλμοί, γλυκόζη, GPS και συνθήκες σε μία οθόνη, η θέση σου πάνω στο υψομετρικό, και ο επόμενος σταθμός με το τι θα πάρεις. Κάθε ένδειξη σχεδιασμένη για ματιά δύο δευτερολέπτων — δεκαοκτώ ώρες μέσα στον αγώνα, με κομμένη ανάσα. Φωτεινό και σκούρο, πέντε accent χρώματα.<\u002Fp>\n      <div style=\"display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:rgba(235,235,245,0.60)\">\n        <span style=\"border:1px solid rgba(84,84,88,0.6);border-radius:999px;padding:5px 12px\">Παλμοί μέσω BLE<\u002Fspan>\n        <span style=\"border:1px solid rgba(84,84,88,0.6);border-radius:999px;padding:5px 12px\">Γλυκόζη μέσω Health<\u002Fspan>\n        <span style=\"border:1px solid rgba(84,84,88,0.6);border-radius:999px;padding:5px 12px\">Βοηθός εν αγώνι<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"devices\" style=\"max-width:1180px;margin:0 auto;padding:90px 40px 30px\">\n  <h2 style=\"margin:0 0 8px;font-size:36px;font-weight:800;letter-spacing:-0.01em;text-align:center\">Το iPhone αποφασίζει. Όλα τα άλλα καθρεφτίζουν.<\u002Fh2>\n  <p style=\"margin:0 auto 44px;font-size:16px;color:rgba(235,235,245,0.60);text-align:center;max-width:580px;text-wrap:pretty\">Το iPhone έχει το πλάνο. Το iPad παίρνει διπλές διατάξεις για σχεδιασμό και ανασκόπηση. Το Watch δείχνει τον αγώνα και ρωτάει πριν από οτιδήποτε μη αναστρέψιμο.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:2fr 1fr;gap:20px;align-items:stretch\">\n    <div style=\"background:#212630;border:1px solid rgba(84,84,88,0.5);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:14px\">\n      <div style=\"font-size:14px;font-weight:700\">iPad — σχεδιασμός και ανασκόπηση<\u002Fdiv>\n      <img src=\"a9027da0-0f63-434e-95af-5c3382306eb8\" alt=\"Το Oxygon σε iPad\" style=\"width:100%;border-radius:12px;border:1px solid rgba(84,84,88,0.5);display:block\">\n    <\u002Fdiv>\n    <div style=\"background:#212630;border:1px solid rgba(84,84,88,0.5);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:14px\">\n      <div style=\"font-size:14px;font-weight:700\">Apple Watch — ο αγώνας με μια ματιά<\u002Fdiv>\n      <div style=\"display:flex;gap:12px;justify-content:center;align-items:flex-start;flex:1\">\n        <img src=\"4963ac51-e677-4e9a-88d5-d74778dd38e3\" alt=\"Watch: live τρέξιμο\" style=\"width:46%;border-radius:18px;border:1px solid rgba(84,84,88,0.5)\">\n        <img src=\"e273c50c-91a6-402b-8ff7-9bb57750741a\" alt=\"Watch: επόμενος σταθμός\" style=\"width:46%;border-radius:18px;border:1px solid rgba(84,84,88,0.5);margin-top:22px\">\n      <\u002Fdiv>\n      <div style=\"font-size:13px;color:rgba(235,235,245,0.60);line-height:1.5\">Τέσσερις σελίδες στον καρπό συν complication. Το DNF δεν υπάρχει στο ρολόι — επίτηδες.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"crew\" style=\"max-width:1180px;margin:0 auto;padding:90px 40px 30px\">\n  <div style=\"background:linear-gradient(180deg,#161B26,#0B0F19);border:1px solid rgba(84,84,88,0.5);border-radius:24px;padding:0;overflow:hidden\">\n    <sc-if value=\"{{ crewClosed }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"display:grid;grid-template-columns:1fr 1.4fr;gap:48px;align-items:start;padding:52px 52px 0\">\n      <div style=\"display:flex;flex-direction:column;gap:16px;padding-bottom:52px\">\n        <div style=\"font-size:13px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#3DD47A\">Crew tracking<\u002Fdiv>\n        <h2 style=\"margin:0;font-size:32px;font-weight:800;letter-spacing:-0.01em;line-height:1.15\">Όσοι νοιάζονται, παρακολουθούν — χωρίς app, χωρίς login<\u002Fh2>\n        <p style=\"margin:0;font-size:15px;line-height:1.65;color:rgba(235,235,245,0.60);text-wrap:pretty\">Μοιράσου έναν σύνδεσμο. Το crew σου βλέπει ρυθμό, παλμούς, συνθήκες και τη θέση σου στη διαδρομή ζωντανά — και τικάρει σταθμούς μαζί σου, αμφίδρομα. Σου στέλνουν μήνυμα· το παίρνεις στον καρπό σου.<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:9px;font-size:14px;color:rgba(235,235,245,0.60)\">\n          <div style=\"display:flex;gap:10px;align-items:baseline\"><span style=\"color:#3DD47A;font-weight:700;font-variant-numeric:tabular-nums\">1<\u002Fspan>Ξεκίνα τον αγώνα σου στο Oxygon<\u002Fdiv>\n          <div style=\"display:flex;gap:10px;align-items:baseline\"><span style=\"color:#3DD47A;font-weight:700;font-variant-numeric:tabular-nums\">2<\u002Fspan>Στείλε τον σύνδεσμο στο crew σου<\u002Fdiv>\n          <div style=\"display:flex;gap:10px;align-items:baseline\"><span style=\"color:#3DD47A;font-weight:700;font-variant-numeric:tabular-nums\">3<\u002Fspan>Παρακολουθούν, τικάρουν και σε αποθεώνουν — από παντού<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div sc-camel-on-click=\"{{ openCrew }}\" style=\"position:relative;cursor:pointer\">\n        <img src=\"c04c1920-6315-4cc7-9f2a-7d634eadf7ef\" alt=\"Σελίδα crew tracking\" style=\"width:100%;border-radius:14px 14px 0 0;border:1px solid rgba(84,84,88,0.5);border-bottom:none;display:block;box-shadow:0 -20px 60px rgba(0,0,0,0.4)\">\n        <div style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(11,15,25,0.35);transition:background 0.3s\" style-hover=\"background:rgba(11,15,25,0.12)\">\n          <div style=\"display:flex;align-items:center;gap:9px;background:rgba(11,15,25,0.85);border:1px solid rgba(255,255,255,0.22);border-radius:999px;padding:11px 20px;font-size:14px;font-weight:700;backdrop-filter:blur(6px)\"><span style=\"display:inline-block;width:8px;height:8px;border-radius:50%;background:#3DD47A;animation:oxPulse 1.6s ease-in-out infinite\"><\u002Fspan>Άνοιξε το live demo<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ crewOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding:26px 34px 22px;background:{{ th.bg }};color:{{ th.tx }};display:flex;flex-direction:column;gap:16px;transition:background 0.3s,color 0.3s\">\n      <div style=\"display:flex;align-items:center;gap:14px\">\n        <div style=\"font-size:16px;font-weight:800\">Oxygon <span style=\"color:#4F9EFF;font-weight:700\">· Live<\u002Fspan><\u002Fdiv>\n        <div style=\"margin:0 auto;display:flex;gap:2px;border:1px solid {{ th.bd }};border-radius:999px;padding:3px;font-size:12px;font-weight:600\">\n          <div sc-camel-on-click=\"{{ thAuto }}\" style=\"padding:5px 14px;border-radius:999px;cursor:pointer;user-select:none;background:{{ segAutoB }};color:{{ segAutoC }}\">Auto<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ thLight }}\" style=\"padding:5px 12px;border-radius:999px;cursor:pointer;user-select:none;background:{{ segLightB }};color:{{ segLightC }}\">☀<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ thDark }}\" style=\"padding:5px 12px;border-radius:999px;cursor:pointer;user-select:none;background:{{ segDarkB }};color:{{ segDarkC }}\">☾<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px;border:1px solid rgba(229,72,77,0.55);border-radius:999px;padding:7px 16px;font-size:12px;font-weight:700;letter-spacing:0.06em;color:#E5484D\"><span style=\"display:inline-block;width:8px;height:8px;border-radius:50%;background:#E5484D;animation:oxPulse 1.6s ease-in-out infinite\"><\u002Fspan>LIVE<\u002Fdiv>\n        <div sc-camel-on-click=\"{{ closeCrew }}\" style=\"width:28px;height:28px;border-radius:50%;background:{{ th.card }};border:1px solid {{ th.bd }};display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;user-select:none\">✕<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:30px;font-weight:800;letter-spacing:-0.01em\">Athens Authentic Marathon<\u002Fdiv>\n        <div style=\"font-size:14px;color:{{ th.sub }};margin-top:4px\">42 km · target 3h 30m · Start 09:00<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:baseline;gap:12px\">\n        <div style=\"font-size:50px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-0.01em;line-height:1\">{{ cw.elapsed }}<\u002Fdiv>\n        <div style=\"font-size:12px;font-weight:700;letter-spacing:0.1em;color:{{ th.sub }}\">ELAPSED<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:7px\">\n        <div style=\"height:6px;border-radius:3px;background:{{ th.card }}\"><div style=\"height:6px;border-radius:3px;background:linear-gradient(90deg,#2563EB,#4F9EFF);transition:width 1s linear;width:{{ cw. ursor:pointer;user-select:none;border:1px solid {{ tempChip.bd }};color:{{ tempChip.c }};background:{{ tempChip.b }}\"><span style=\"display:inline-block;width:7px;height:7px;border-radius:50%;background:#E0851A\"><\u002Fspan>Temp<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ tHum }}\" style=\"display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 13px;border-radius:999px;cursor:pointer;user-select:none;border:1px solid {{ humChip.bd }};color:{{ humChip.c }};background:{{ humChip.b }}\"><span style=\"display:inline-block;width:7px;height:7px;border-radius:50%;background:#38BDF8\"><\u002Fspan>Humidity<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ tGlu }}\" style=\"display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 13px;border-radius:999px;cursor:pointer;user-select:none;border:1px solid {{ gluChip.bd }};color:{{ gluChip.c }};background:{{ gluChip.b }}\"><span style=\"display:inline-block;width:7px;height:7px;border-radius:50%;background:#8B7CF6\"><\u002Fspan>Glucose<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"position:relative\">\n          <svg sc-camel-view-box=\"0 0 720 210\" style=\"width:100%;display:block\">\n            <path d=\"{{ elevD }}\" fill=\"rgba(79,158,255,0.18)\" stroke=\"#4F9EFF\" stroke-width=\"1.8\"><\u002Fpath>\n            <polyline points=\"{{ hrPts }}\" fill=\"none\" stroke=\"#FF375F\" stroke-width=\"2\" opacity=\"{{ hrOp }}\" style=\"transition:opacity 0.3s\"><\u002Fpolyline>\n            <polyline points=\"{{ tempPts }}\" fill=\"none\" stroke=\"#E0851A\" stroke-width=\"2\" opacity=\"{{ tempOp }}\" style=\"transition:opacity 0.3s\"><\u002Fpolyline>\n            <polyline points=\"{{ humPts }}\" fill=\"none\" stroke=\"#38BDF8\" stroke-width=\"2\" opacity=\"{{ humOp }}\" style=\"transition:opacity 0.3s\"><\u002Fpolyline>\n            <polyline points=\"{{ gluPts }}\" fill=\"none\" stroke=\"#8B7CF6\" stroke-width=\"2\" opacity=\"{{ gluOp }}\" style=\"transition:opacity 0.3s\"><\u002Fpolyline>\n            <line x1=\"{{ cw.cx }}\" x2=\"{{ cw.cx }}\" y1=\"18\" y2=\"205\" stroke=\"#E5484D\" stroke-width=\"1\" opacity=\"0.7\" stroke-dasharray=\"2 3\"><\u002Fline>\n            <circle cx=\"{{ cw.cx }}\" cy=\"{{ cw.cy }}\" r=\"4.5\" fill=\"#E5484D\" stroke=\"#FFFFFF\" stroke-width=\"1.5\"><\u002Fcircle>\n          <\u002Fsvg>\n          <div style=\"position:absolute;left:4px;top:0;font-size:10px;color:{{ th.sub }}\">247 m<\u002Fdiv>\n          <div style=\"position:absolute;left:4px;bottom:0;font-size:10px;color:{{ th.sub }}\">8 m<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;font-size:10px;color:{{ th.sub }};font-variant-numeric:tabular-nums\"><span>0<\u002Fspan><span>10.6<\u002Fspan><span>21.1<\u002Fspan><span>31.7<\u002Fspan><span>42.2 km<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"text-align:center;font-size:12px;color:{{ th.sub }};line-height:1.7\">Live · updated just now<br><span style=\"font-size:11px\">Powered by <b style=\"color:{{ th.tx }}\">Oxygon<\u002Fb> · Live race tracking · simulated demo data<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"tools\" style=\"max-width:1180px;margin:0 auto;padding:90px 40px 30px;display:grid;grid-template-columns:1fr 1.6fr;gap:56px;align-items:center\">\n  <div style=\"display:flex;flex-direction:column;gap:14px\">\n    <div style=\"font-size:13px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#0A84FF\">ΕΡΓΑΛΕΙΑ<\u002Fdiv>\n    <h2 style=\"margin:0;font-size:36px;font-weight:800;letter-spacing:-0.01em;line-height:1.12\">Οκτώ υπολογιστές. Δωρεάν, για πάντα.<\u002Fh2>\n    <p style=\"margin:0;font-size:16px;line-height:1.65;color:rgba(235,235,245,0.60);text-wrap:pretty\">Δουλεύουν χωρίς λογαριασμό, επίτηδες. Απαντούν στην ερώτηση που κάνει κάθε αθλητής — και μετά κρατάς το app.<\u002Fp>\n    <div style=\"font-size:13px;color:rgba(235,235,245,0.35)\">Πάτα μια κάρτα για να τη δεις →<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start\">\n    <sc-for list=\"{{ tools }}\" as=\"t\" hint-placeholder-count=\"8\">\n      <div sc-camel-on-click=\"{{ t.toggle }}\" style=\"background:#212630;border:1px solid {{ t.border }};border-radius:14px;padding:16px 18px;cursor:pointer;user-select:none;transition:border-color 0.3s\" style-hover=\"border-color:rgba(10,132,255,0.7)\">\n        <div style=\"display:flex;align-items:center;gap:8px\"><div style=\"font-size:15px;font-weight:700\">{{ t.title }}<\u002Fdiv><div style=\"margin-left:auto;color:rgba(235,235,245,0.50);font-size:10px;transition:transform 0.3s;transform:{{ t.rot }}\">▼<\u002Fdiv><\u002Fdiv>\n        <div style=\"font-size:13px;color:rgba(235,235,245,0.60);margin-top:3px\">{{ t.desc }}<\u002Fdiv>\n        <div style=\"overflow:hidden;transition:max-height 0.45s ease,opacity 0.35s ease;max-height:{{ t.mh }};opacity:{{ t.op }}\">{{ t.imgEl }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"races\" style=\"max-width:1180px;margin:0 auto;padding:90px 40px 30px;display:grid;grid-template-columns:1.4fr 1fr;gap:56px;align-items:center\">\n  <img src=\"d08830a2-edab-4cea-ba13-cac9b82be755\" alt=\"Βιβλιοθήκη αγώνων με χάρτες διαδρομών σε iPad\" style=\"width:100%;border-radius:16px;border:1px solid rgba(84,84,88,0.6);box-shadow:0 24px 60px rgba(0,0,0,0.45)\">\n  <div style=\"display:flex;flex-direction:column;gap:14px\">\n    <div style=\"font-size:13px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#0A84FF\">ΒΙΒΛΙΟΘΗΚΗ ΑΓΩΝΩΝ<\u002Fdiv>\n    <h2 style=\"margin:0;font-size:36px;font-weight:800;letter-spacing:-0.01em;line-height:1.12\">90+ πραγματικοί αγώνες, με την πραγματική διαδρομή<\u002Fh2>\n    <p style=\"margin:0;font-size:16px;line-height:1.65;color:rgba(235,235,245,0.60);text-wrap:pretty\">Από τη Βοστόνη μέχρι το Comrades και το UTMB — διαδρομή GPX, υψομετρικό και cut-offs σε κάθε έναν. Φόρτωσε αγώνα και η απόσταση δεν μπορεί να διαφωνήσει με τη διαδρομή. Ο δικός σου λείπει; Υπόβαλέ τον.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"about\" style=\"max-width:760px;margin:0 auto;padding:90px 40px 30px;text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center\">\n  <img src=\"055d0922-b0f6-4f19-a713-777b952919e0\" alt=\"\" style=\"width:64px;height:64px;border-radius:15px\">\n  <h2 style=\"margin:0;font-size:32px;font-weight:800;letter-spacing:-0.01em\">Γιατί το φτιάξαμε<\u002Fh2>\n  <p style=\"margin:0;font-size:16px;line-height:1.7;color:rgba(235,235,245,0.60);text-wrap:pretty\">Οι περισσότεροι αγώνες αντοχής δεν χάνονται από φυσική κατάσταση. Χάνονται από την τροφοδοσία — ένα πλάνο γραμμένο σε χαρτάκι κολλημένο στο παγούρι. Το Oxygon υπάρχει για να επιβιώνει το πλάνο από την επαφή με τον αγώνα: στο τηλέφωνό σου, στον καρπό σου, και στα χέρια αυτών που σε συνοδεύουν.<\u002Fp>\n  <p style=\"margin:0;font-size:14px;color:rgba(235,235,245,0.30)\">Φτιαγμένο από τον Roberto Zanon, δρομέα υπεραποστάσεων στην Αθήνα. Το κενό σημαίνει κενό — αν ένα νούμερο δεν είναι ζωντανό, λέμε γιατί.<\u002Fp>\n<\u002Fsection>\n\n<section id=\"download\" style=\"max-width:1180px;margin:0 auto;padding:70px 40px 90px;text-align:center;display:flex;flex-direction:column;gap:20px;align-items:center\">\n  <h2 style=\"margin:0;font-size:42px;font-weight:800;letter-spacing:-0.02em\">Η καλύτερη σεζόν σου ξεκινά εδώ<\u002Fh2>\n  <div style=\"display:flex;gap:14px;justify-content:center;flex-wrap:wrap\">\n    <a href=\"#download\" style=\"display:inline-flex;align-items:center;gap:9px;background:#FFFFFF;color:#0B0F19;font-size:17px;font-weight:700;padding:15px 26px;border-radius:999px\" style-hover=\"background:#D8E4F5\"><span style=\"font-size:22px;line-height:1\"><\u002Fspan>Κατέβασέ το στο App&nbsp;Store<\u002Fa>\n    <a href=\"#download\" style=\"display:inline-flex;align-items:center;gap:9px;border:1.5px solid rgba(255,255,255,0.35);color:#FFFFFF;font-size:17px;font-weight:700;padding:14px 26px;border-radius:999px;box-sizing:border-box\" style-hover=\"border-color:#FFFFFF\"><span style=\"font-size:17px;line-height:1\">▶<\u002Fspan>Απόκτησέ το στο Google&nbsp;Play<\u002Fa>\n  <\u002Fdiv>\n  <div style=\"font-size:13px;color:rgba(235,235,245,0.30)\">Δωρεάν υπολογιστές και demo. Το Oxygon&nbsp;Pro ξεκλειδώνει πλάνα και ζωντανή καθοδήγηση.<\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"border-top:1px solid rgba(84,84,88,0.35)\">\n  <div style=\"max-width:1180px;margin:0 auto;padding:28px 40px;display:flex;align-items:center;gap:24px;font-size:13px;color:rgba(235,235,245,0.60)\">\n    <div style=\"display:flex;align-items:center;gap:8px;color:#FFFFFF;font-weight:600\"><img src=\"80633ad4-c473-4022-ba00-ae6251a58126\" alt=\"\" style=\"width:18px;height:18px;border-radius:4px\">Oxygon<\u002Fdiv>\n    <a href=\"#features\" style=\"color:rgba(235,235,245,0.60)\">Δυνατότητες<\u002Fa>\n    <a href=\"#crew\" style=\"color:rgba(235,235,245,0.60)\">Crew<\u002Fa>\n    <a href=\"#tools\" style=\"color:rgba(235,235,245,0.60)\">Εργαλεία<\u002Fa>\n    <a href=\"#races\" style=\"color:rgba(235,235,245,0.60)\">Αγώνες<\u002Fa>\n    <a href=\"privacy.html\" style=\"color:rgba(235,235,245,0.60)\">Απόρρητο<\u002Fa>\n    <a href=\"support.html\" style=\"color:rgba(235,235,245,0.60)\">Υποστήριξη<\u002Fa>\n    <span style=\"margin-left:auto\">© 2026 Oxygon<\u002Fspan>\n    <a href=\"index.html\" style=\"color:rgba(235,235,245,0.60)\">English<\u002Fa>\n  <\u002Fdiv>\n<\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    hr: 137, mounted: false,\n    fuel: { water: 500, cho: 60, sodium: 500 }, method: 'cp', openTool: -1,\n    crew: { open: false, t: 4186, dist: 14.05, paceS: 298, hr: 127, glu: 109, theme: 'auto', ov: { hr: false, temp: true, hum: false, glu: false } },\n    cps: [\n      { name: 'CP 02', km: '9.0 χλμ', eta: '45λ', clock: '07:45', done: false, metrics: [\n        { label: 'Νερό', unit: 'ml', value: 500, def: 500, max: 750, step: 50, color: '#4F9EFF' },\n        { label: 'Υδατ.', unit: 'g', value: 25, def: 25, max: 90, step: 25, color: '#FFB53D' },\n        { label: 'Νάτριο', unit: 'mg', value: 200, def: 200, max: 600, step: 100, color: '#7D73DB' } ] },\n      { name: 'CP 03', km: '16.0 χλμ', eta: '1:20', clock: '08:20', done: false, metrics: [\n        { label: 'Νερό', unit: 'ml', value: 300, def: 300, max: 750, step: 50, color: '#4F9EFF' },\n        { label: 'Υδατ.', unit: 'g', value: 50, def: 50, max: 90, step: 25, color: '#FFB53D' },\n        { label: 'Νάτριο', unit: 'mg', value: 350, def: 350, max: 600, step: 100, color: '#7D73DB' } ] },\n      { name: 'CP 04', km: '22.0 χλμ', eta: '1:50', clock: '08:50', done: false, metrics: [\n        { label: 'Νερό', unit: 'ml', value: 500, def: 500, max: 750, step: 50, color: '#4F9EFF' },\n        { label: 'Υδατ.', unit: 'g', value: 75, def: 75, max: 90, step: 25, color: '#FFB53D' },\n        { label: 'Νάτριο', unit: 'mg', value: 500, def: 500, max: 600, step: 100, color: '#7D73DB' } ] }\n    ]\n  };\n  componentDidMount() {\n    this._t = setTimeout(() => this.setState({ mounted: true }), 350);\n    this._iv = setInterval(() => this.setState(s => ({ hr: Math.max(131, Math.min(143, s.hr + [-2, -1, 1, 2][Math.floor(Math.random() * 4)])) })), 2000);\n  }\n  componentWillUnmount() { clearTimeout(this._t); clearInterval(this._iv); clearInterval(this._cw); }\n  _route() {\n    if (this._rt) return this._rt;\n    const wp = [[38.156,23.962],[38.141,23.972],[38.118,23.980],[38.087,23.979],[38.060,23.994],[38.030,23.995],[38.008,23.951],[38.006,23.912],[38.000,23.868],[37.993,23.828],[37.988,23.795],[37.976,23.762],[37.968,23.741]];\n    const seg = [0];\n    for (let i = 1; i < wp.length; i++) {\n      const dx = (wp[i][1] - wp[i-1][1]) * Math.cos(wp[i][0] * Math.PI / 180) * 111.32;\n      const dy = (wp[i][0] - wp[i-1][0]) * 110.57;\n      seg.push(seg[i-1] + Math.sqrt(dx*dx + dy*dy));\n    }\n    this._rt = { wp, seg, total: seg[seg.length-1] };\n    return this._rt;\n  }\n  _pos(km) {\n    const R = this._route(), d = Math.max(0, Math.min(1, km / 42.2)) * R.total;\n    let i = 1; while (i < R.seg.length - 1 && R.seg[i] < d) i++;\n    const f = (d - R.seg[i-1]) / (R.seg[i] - R.seg[i-1]);\n    return [R.wp[i-1][0] + (R.wp[i][0] - R.wp[i-1][0]) * f, R.wp[i-1][1] + (R.wp[i][1] - R.wp[i-1][1]) * f];\n  }\n  _initMap(el) {\n    if (!el) { if (this._map) { this._map.remove(); this._map = null; this._runner = null; } return; }\n    if (this._map) return;\n    if (!window.L) { setTimeout(() => { if (el.isConnected) this._initMap(el); }, 400); return; }\n    const L = window.L, R = this._route();\n    const m = L.map(el, { scrollWheelZoom: false });\n    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(m);\n    const line = L.polyline(R.wp, { color: '#3B82F6', weight: 4, opacity: 0.9 }).addTo(m);\n    for (let k = 1; k <= 7; k++) L.circleMarker(this._pos(k * 5.275), { radius: 4, color: '#111827', weight: 1.5, fillColor: '#4B5563', fillOpacity: 1 }).addTo(m);\n    L.circleMarker(R.wp[0], { radius: 6, color: '#FFFFFF', weight: 2, fillColor: '#22C55E', fillOpacity: 1 }).addTo(m);\n    this._runner = L.circleMarker(this._pos(this.state.crew.dist), { radius: 8, color: '#E5484D', weight: 3, fillColor: '#FFFFFF', fillOpacity: 1 }).addTo(m);\n    m.fitBounds(line.getBounds(), { padding: [26, 26] });\n    setTimeout(() => { m.invalidateSize(); m.fitBounds(line.getBounds(), { padding: [26, 26] }); }, 150);\n    this._map = m;\n  }\n  _chart() {\n    if (this._cd) return this._cd;\n    const a = [[0,12],[3,25],[6,22],[10,35],[13,30],[17,56],[21,90],[24,120],[27,160],[31,247],[34,215],[37,170],[40,140],[42.2,128]];\n    const elevAt = (km) => {\n      let i = 1; while (i < a.length - 1 && a[i][0] < km) i++;\n      const p = a[i-1], q = a[i], f = (km - p[0]) / (q[0] - p[0]);\n      return p[1] + (q[1] - p[1]) * f + 4 * Math.sin(km * 2.1);\n    };\n    const N = 90, ex = [], hr = [], tp = [], hu = [], gl = [];\n    for (let i = 0; i < N; i++) {\n      const km = i / (N-1) * 42.2, x = i / (N-1) * 720;\n      ex.push([x, 205 - Math.max(0, elevAt(km)) / 250 * 175]);\n      hr.push([x, 188 - (120 + km * 0.7 + 5 * Math.sin(km / 2) - 115) / 45 * 130]);\n      tp.push([x, 188 - (22 + km * 0.09 + 1.2 * Math.sin(km / 6) - 21) / 6 * 130]);\n      hu.push([x, 188 - (52 - km * 0.25 + 2 * Math.sin(km / 4) - 38) / 18 * 130]);\n      gl.push([x, 188 - (105 + 12 * Math.sin(km / 5 + 1) + 4 * Math.sin(km / 1.3) - 88) / 34 * 130]);\n    }\n    const pts = arr => arr.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');\n    const elevD = 'M 0 205 L ' + ex.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L ') + ' L 720 205 Z';\n    this._cd = { elevD, hrPts: pts(hr), tempPts: pts(tp), humPts: pts(hu), gluPts: pts(gl), ex, N };\n    return this._cd;\n  }\n  _fmtT(sec) { const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = Math.floor(sec % 60); return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0'); }\n  _fmtP(s) { return Math.floor(s / 60) + ':' + String(Math.round(s % 60)).padStart(2, '0'); }\n  _tickCrew() {\n    this.setState(s => {\n      const c = s.crew;\n      const paceS = Math.max(285, Math.min(312, c.paceS + Math.round(Math.random() * 6 - 3)));\n      const dist = Math.min(42.2, c.dist + 1 / paceS);\n      const hr = Math.max(122, Math.min(152, c.hr + Math.round(Math.random() * 4 - 2)));\n      const glu = Math.max(96, Math.min(124, c.glu + Math.round(Math.random() * 2 - 1)));\n      return { crew: { ...c, t: c.t + 1, dist, paceS, hr, glu } };\n    });\n    if (this._runner) this._runner.setLatLng(this._pos(this.state.crew.dist));\n  }\n  _tOv(k) { this.setState(s => ({ crew: { ...s.crew, ov: { ...s.crew.ov, [k]: !s.crew.ov[k] } } })); }\n  _setTheme(v) { this.setState(s => ({ crew: { ...s.crew, theme: v } })); }\n  _crewVals() {\n    const D = this._chart(), c = this.state.crew, p = c.dist / 42.2;\n    const light = c.theme === 'light';\n    const th = light\n      ? { bg: '#F4F6FA', tx: '#0B0F19', sub: 'rgba(60,60,67,0.65)', card: '#FFFFFF', bd: 'rgba(0,0,0,0.09)' }\n      : { bg: '#0A0F1E', tx: '#FFFFFF', sub: 'rgba(235,235,245,0.60)', card: 'rgba(255,255,255,0.05)', bd: 'rgba(255,255,255,0.09)' };\n    const segB = on => on ? (light ? 'rgba(0,0,0,0.10)' : 'rgba(255,255,255,0.16)') : 'transparent';\n    const segC = on => on ? th.tx : th.sub;\n    const cpSize = 42.2 / 8, passed = Math.min(8, Math.floor(c.dist / cpSize));\n    const nextIn = Math.max(0, Math.min(8, passed + 1) * cpSize - c.dist);\n    const finishS = Math.round(c.t / Math.max(0.01, p)), togoS = Math.max(0, finishS - c.t);\n    const chip = (on, rgb) => ({ c: on ? th.tx : th.sub, b: on ? 'rgba(' + rgb + ',0.16)' : 'transparent', bd: on ? 'rgba(' + rgb + ',0.8)' : th.bd });\n    const cy = D.ex[Math.min(D.N - 1, Math.round(p * (D.N - 1)))][1];\n    if (!this._mapRefFn) this._mapRefFn = (el) => this._initMap(el);\n    return {\n      crewOpen: c.open, crewClosed: !c.open, th, mapRef: this._mapRefFn,\n      openCrew: () => { if (!this._cw) this._cw = setInterval(() => this._tickCrew(), 1000); this.setState(s => ({ crew: { ...s.crew, open: true } })); },\n      closeCrew: () => { clearInterval(this._cw); this._cw = null; this.setState(s => ({ crew: { ...s.crew, open: false } })); },\n      thAuto: () => this._setTheme('auto'), thLight: () => this._setTheme('light'), thDark: () => this._setTheme('dark'),\n      segAutoB: segB(c.theme === 'auto'), segAutoC: segC(c.theme === 'auto'),\n      segLightB: segB(light), segLightC: segC(light),\n      segDarkB: segB(c.theme === 'dark'), segDarkC: segC(c.theme === 'dark'),\n      elevD: D.elevD, hrPts: D.hrPts, tempPts: D.tempPts, humPts: D.humPts, gluPts: D.gluPts,\n      hrOp: c.ov.hr ? '1' : '0', tempOp: c.ov.temp ? '1' : '0', humOp: c.ov.hum ? '1' : '0', gluOp: c.ov.glu ? '1' : '0',\n      tHr: () => this._tOv('hr'), tTemp: () => this._tOv('temp'), tHum: () => this._tOv('hum'), tGlu: () => this._tOv('glu'),\n      hrChip: chip(c.ov.hr, '255,55,95'), tempChip: chip(c.ov.temp, '224,133,26'), humChip: chip(c.ov.hum, '56,189,248'), gluChip: chip(c.ov.glu, '139,124,246'),\n      cw: {\n        elapsed: this._fmtT(c.t), pct: Math.round(p * 100), progPct: (p * 100).toFixed(1) + '%',\n        distRound: Math.floor(c.dist), distExact: c.dist.toFixed(2),\n        pace: this._fmtP(c.paceS), speed: (3600 / c.paceS).toFixed(1),\n        finish: this._fmtT(finishS), togo: Math.floor(togoS / 3600) + 'h ' + Math.floor(togoS % 3600 / 60) + 'm to go',\n        cpCount: passed + '/8', nextIn: nextIn.toFixed(1),\n        hr: c.hr, glu: c.glu,\n        cx: (p * 720).toFixed(1), cy: cy.toFixed(1)\n      }\n    };\n  }\n  adjust(ci, mi, d) {\n    this.setState(s => ({ cps: s.cps.map((c, i) => i !== ci ? c : { ...c, metrics: c.metrics.map((m, j) => j !== mi ? m : { ...m, value: Math.max(0, Math.min(m.max, m.value + d * m.step)) }) }) }));\n  }\n  renderVals() {\n    const cps = this.state.cps.map((c, ci) => ({\n      ...c,\n      check: c.done ? '✓' : '',\n      doneBg: c.done ? '#3DD47A' : 'transparent',\n      rowOpacity: c.done ? '0.4' : '1',\n      toggle: () => this.setState(s => ({ cps: s.cps.map((x, i) => i === ci ? { ...x, done: !x.done } : x) })),\n      metrics: c.metrics.map((m, mi) => ({\n        ...m,\n        display: m.value + ' ' + m.unit,\n        pct: (this.state.mounted ? Math.round(m.value / m.max * 100) : 0) + '%',\n        inc: () => this.adjust(ci, mi, 1),\n        dec: () => this.adjust(ci, mi, -1)\n      }))\n    }));\n    const mkSlider = (key, label, unit, min, max, step) => ({\n      label, min, max, step,\n      value: this.state.fuel[key],\n      display: this.state.fuel[key] + ' ' + unit,\n      set: (e) => { const v = Number(e.target.value); this.setState(s => ({ fuel: { ...s.fuel, [key]: v } })); }\n    });\n    const cp = this.state.method === 'cp';\n    const toolData = [\n      ['Υπολογιστής ρυθμού', 'ρυθμός · χρόνος · απόσταση', 'assets/site/calc-pace.png'],\n      ['Critical Speed', 'κατώφλι από δύο time trials', 'assets/site/calc-cs.png'],\n      ['Πρόβλεψη αγώνα', 'χρόνος τερματισμού σε κάθε απόσταση', 'assets/site/calc-predictor.png'],\n      ['Εκτίμηση VO₂max', 'από πρόσφατο αποτέλεσμα', 'assets/site/calc-vo2.png'],\n      ['Ζώνες παλμών', '%Max HR ή Karvonen', 'assets/site/calc-hr.png'],\n      ['Ρυθμοί προπόνησης', 'easy → repetition, από ρυθμό-στόχο', 'assets/site/calc-training.png'],\n      ['Grade-Adjusted Pace', 'ισοδύναμο επιπέδου για ανηφόρες', 'assets/site/calc-gap.png'],\n      ['Θερμίδες', 'εκτίμηση ενεργειακού κόστους', 'assets/site/calc-calories.png']\n    ];\n    const tools = toolData.map((t, i) => {\n      const open = this.state.openTool === i;\n      return {\n        title: t[0], desc: t[1],\n        imgEl: open ? React.createElement('img', { src: t[2], alt: t[0], style: { width: 172, margin: '12px auto 0', borderRadius: 14, border: '1px solid rgba(84,84,88,0.5)', display: 'block' } }) : null,\n        toggle: () => this.setState(s => ({ openTool: s.openTool === i ? -1 : i })),\n        mh: open ? '420px' : '0px', op: open ? '1' : '0',\n        rot: open ? 'rotate(180deg)' : 'rotate(0deg)',\n        border: open ? 'rgba(10,132,255,0.8)' : 'rgba(84,84,88,0.5)'\n      };\n    });\n    return {\n      ...this._crewVals('Τερματισμός'),\n      hr: this.state.hr, cps, tools,\n      sliders: [mkSlider('water', 'Νερό', 'ml/hr', 250, 1250, 25), mkSlider('cho', 'CHO', 'g/hr', 20, 120, 5), mkSlider('sodium', 'Νάτριο', 'mg/hr', 0, 1500, 50)],\n      suggest: () => this.setState({ fuel: { water: 775, cho: 80, sodium: 750 } }),\n      cpSel: cp ? 'rgba(255,255,255,0.22)' : 'transparent',\n      timeSel: cp ? 'transparent' : 'rgba(255,255,255,0.22)',\n      cpCol: cp ? '#FFFFFF' : 'rgba(235,235,245,0.6)',\n      timeCol: cp ? 'rgba(235,235,245,0.6)' : '#FFFFFF',\n      setCp: () => this.setState({ method: 'cp' }),\n      setTime: () => this.setState({ method: 'time' }),\n      calc: () => this.setState(s => ({ cps: s.cps.map(c => ({ ...c, metrics: c.metrics.map(m => ({ ...m, value: m.def })) })) }))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
